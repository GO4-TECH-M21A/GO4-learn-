<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GO4 learn</title>
  <link rel="stylesheet" href="style.css">
<style>
  body {
  background-color: black;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  padding: 20px;
}

h1 {
  color: gold;
}

.boite {
  border: 1px solid gold;
  border-radius: 15px;
  padding: 20px;
  margin: 20px auto;
  max-width: 400px;
}

input, select {
  width: 100%;
  background-color: black;
  color: white;
  border: 1px solid gold;
  border-radius: 10px;
  padding: 12px;
  margin: 8px 0;
  box-sizing: border-box;
}

button {
  width: 100%;
  background-color: gold;
  color: black;
  border: none;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

a {
  color: gold;
}
</style>
</head>
<body>
  <h1>L'univers de GO4 apprentissage</h1>
  <h2>Nous sommes disponibles <br>pour vos services</h2>
  <p>Connexion <strong>GO4 learn</strong> </p>
  <input type="text" placeholder="NOM">
  <br> 
  <input type="text" placeholder="Prénom">
 <br> 
 <input type="Gmail" placeholder="adresse Gmail"> 
  <br>
  <a href="Welcome.html"><button onclick="sauver()">Connecter></button></a>
<br>
  <p><strong>Pas de compte?</strong></p>
  <h4>Inscrivez-vous</h4>
  <label>Classe de l'élève:</label>
  <br>
  <select Class="Classe de l'élève"> 
    <Option>3e</Option>
    <Option>Tle</Option> 
    </select>
  <input type="texe" placeholder="NOM">
  <input type="texe" placeholder="Prénom">
  <input type="texte" placeholder="Adresse Gmail">
  <br>
 <a href="Welcome.html"><button onclick="sauver()">Inscription</button></a>
    <br>
<p>En cas de dificulté contacter</p>
 <br> 
<a href="https://wa.me/22673667961">Assistance</a>   
  <script>
function sauver(){
  let tous = document.querySelectorAll('input');
  tous.forEach(function(champ){
    if(champ.value != ""){
      if(champ.placeholder == "NOM") localStorage.setItem("nom", champ.value);
      if(champ.placeholder == "Prénom") localStorage.setItem("prenom", champ.value);
    }
  });
  let classe = document.querySelector('select');
  if(classe) localStorage.setItem("classe", classe.value);
}
    </script>
  
</body>
  </html>
